# dsh-LorebookMD — DSH Web overlay（patch 文件），把插件挂载进 DSH。
#
# 使用方法（path 必须为绝对路径）：
#   node "C:\Users\yuyon\.dsh\profiles\node_modules\@deepseek-ai\dsh\lib\bin.js" ^
#        web --patch "G:/Program Files/deepseek_harness/workspase/dsh-LorebookMD/cordis.yml"
#
# 也可以直接双击运行本目录下的 start-dsh-plugin.cmd。
#
# 注意：entry 用包名 `dsh-LorebookMD`（已安装到
# `~/.dsh/profiles/web/node_modules/dsh-LorebookMD`），这样 host 装载 node 半，
# 同时 dsh-client-modules 能扫描到 dsh.client 声明、供给浏览器端 bundle
# （lib/client.js，构建产物），在 设置 → 世界书创作 中提供可视化管理。
#
# 启动后打开 http://127.0.0.1:3080：
#   - 设置 →「世界书创作」：世界书列表 / 进入创作 / 世界书模式 / 编辑文档 / 导入 / 删除
#   - 对话中：prompt_import_tavern / prompt_import_world 等工具同样可用
- insert:
    - id: prompt-manager
      name: 'dsh-LorebookMD'
      config:
        dataDir: '~/.dsh/dsh-LorebookMD'
        sectionName: 'prompt-manager:active'
        sectionOrder: 95
        enableTools: true
        watchFile: true
        worldTrigger: true
